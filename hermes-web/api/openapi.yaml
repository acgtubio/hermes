openapi: 3.0.3
info:
  title: Hermes API
  version: 0.1.0
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report service and database health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /documents:
    post:
      operationId: createDocument
      summary: Upload an SOA PDF and queue it for processing
      description: >
        Stores the PDF and queues it for the OCR pipeline, which takes a minute or two.
        Poll getDocument until status is ready or failed.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Stored and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: The same file was already uploaded; the message names its document id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /documents/{id}:
    get:
      operationId: getDocument
      summary: A document's processing status and row counts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          $ref: "#/components/responses/Error"
  /documents/{id}/events:
    get:
      operationId: streamDocumentEvents
      summary: Server-sent events with the document's status as it changes
      description: >
        A text/event-stream for EventSource. The first `document` event is the current state;
        another follows each status change and, while processing, each finished page
        (pages_done of pages_total). Every `document` event's data is a Document, the same
        JSON as getDocument. Once the status is ready or failed, an `end` event follows and the
        server closes the stream, so the client should close its EventSource rather than let it
        reconnect. A reconnect (after a dropped connection) starts again from the current state.
        Comment lines (": ping") are sent every 20 seconds to keep the connection open.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Document:
      type: object
      required: [id, filename, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        status:
          type: string
          enum: [queued, processing, ready, failed]
        error:
          type: string
          description: Why processing failed (status failed)
        page_count:
          type: integer
        pages_done:
          type: integer
          description: >
            Pages the pipeline has finished, of pages_total. Set while processing (0 once the pages
            are rendered) and kept once ready; absent while queued.
        pages_total:
          type: integer
          description: Pages in the PDF, known once processing has rendered them
        row_count:
          type: integer
        needs_review_count:
          type: integer
          description: Rows with a cell that failed its check or was inferred rather than read
        created_at:
          type: string
          format: date-time
        processed_at:
          type: string
          format: date-time
        trace_id:
          type: string
          description: >
            W3C trace ID of the upload. The processing job's logs (the API's and the pipeline's)
            carry the same ID, so quote it when reporting a problem with this document.
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        error:
          type: string
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
